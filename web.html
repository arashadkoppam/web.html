<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DNIC Sibaq '26 Results TV</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Playfair+Display:wght@700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: #1479e8 url('bg.jpg') center/cover no-repeat;
    font-family: 'Georgia', serif; color: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .cards-row {
    display: flex; gap: 3.2vw; margin-top: 6vh;
    transition: opacity 0.6s ease;
  }

  /* Base Card Layout */
  .card {
    position: relative;
    width: 25vw; height: 39.5vw;
    background: var(--card-bg);
    border-radius: 2vw;
    display: flex; flex-direction: column; align-items: center;
    padding: 3.6vw 1.6vw 1.2vw;
    box-shadow: 0 14px 32px rgba(0, 0, 0, 0.28);
    text-align: center;
    overflow: visible;
  }

  /* Card Color Themes matching your reference */
  .card.theme-0 {
    --card-bg: #4b439c;
    --badge-bg: #f6b11a;
    --badge-stroke: #fff;
    --penta-bg: #26a69a;
    --num-color: #4b439c;
  }
  .card.theme-1 {
    --card-bg: #f48622;
    --badge-bg: #4b439c;
    --badge-stroke: #fff;
    --penta-bg: #289396;
    --num-color: #f48622;
  }
  .card.theme-2 {
    --card-bg: #289396;
    --badge-bg: #f48622;
    --badge-stroke: #fff;
    --penta-bg: #f48622;
    --num-color: #289396;
  }

  /* Top Teardrop Badge */
  .top-badge {
    position: absolute; top: -2.1vw; left: 50%;
    transform: translateX(-50%) rotate(-45deg);
    width: 4.4vw; height: 4.4vw;
    background: var(--badge-bg);
    border-radius: 50% 50% 50% 0;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 14px rgba(0,0,0,0.22);
    z-index: 3;
  }
  .top-badge svg {
    transform: rotate(45deg);
    width: 2.2vw; height: 2.2vw;
    stroke: var(--badge-stroke); fill: none; stroke-width: 2.2;
  }

  /* Category / Header Title */
  .category-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 1.28vw; font-weight: 700;
    letter-spacing: 0.6px; text-transform: uppercase;
    line-height: 1.25; min-height: 3.2vw;
    display: flex; align-items: center; justify-content: center;
    z-index: 2;
  }

  /* Pentagon Frame */
  .pentagon-wrap {
    position: relative;
    width: 14.2vw; height: 13.6vw;
    margin: 0.8vw 0 0.7vw;
    background: var(--penta-bg);
    clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 2;
  }
  .pentagon-wrap img {
    width: 100%; height: 100%;
    object-fit: cover; object-position: top center;
  }

  /* Decorative Sparkles */
  .sparkle {
    position: absolute;
    background: radial-gradient(circle, #ffffff 0%, rgba(255,255,255,0.75) 18%, rgba(255,255,255,0) 68%);
    clip-path: polygon(50% 0%, 56% 44%, 100% 50%, 56% 56%, 50% 100%, 44% 56%, 0% 50%, 44% 44%);
    pointer-events: none; z-index: 2;
  }
  .sparkle.right { width: 4.5vw; height: 4.5vw; top: 8.5vw; right: 1.4vw; }
  .sparkle.left  { width: 3.8vw; height: 3.8vw; top: 18.2vw; left: 1.8vw; }

  /* Candidate Name */
  .candidate-name {
    font-family: 'Fredoka', 'Trebuchet MS', sans-serif;
    font-size: 1.7vw; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.8px;
    line-height: 1.15; margin-top: auto; margin-bottom: 1.2vw;
    text-shadow: 0 2px 5px rgba(0,0,0,0.2);
    z-index: 2;
  }
  .card.no-photo .candidate-name {
    font-size: 2.1vw;
    margin: auto 0;
  }

  /* Bottom Desert Dune Strip */
  .dune-footer {
    position: relative;
    width: calc(100% + 3.2vw);
    height: 7.4vw;
    margin-bottom: -1.2vw;
    border-radius: 0 0 2vw 2vw;
    background:
      radial-gradient(120% 85% at 25% 95%, #c79a74 0%, #9b7a6c 55%, transparent 56%),
      radial-gradient(130% 95% at 85% 90%, #b58d72 0%, #7d6d75 60%, transparent 61%),
      linear-gradient(180deg, #4f6478 0%, #7b6c73 45%, #b98e71 100%);
    display: flex; align-items: flex-start; justify-content: center;
    z-index: 2;
  }

  /* Overlapping Position & Grade Circles */
  .badges-group {
    display: flex; gap: 0.7vw;
    margin-top: -1.7vw;
  }
  .stat-item {
    display: flex; flex-direction: column; align-items: center;
  }
  .stat-circle {
    width: 4.7vw; height: 4.7vw;
    border-radius: 50%;
    background: #f5f2eb;
    color: var(--num-color);
    font-family: 'Georgia', serif;
    font-size: 2.4vw; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.22);
  }
  .stat-label {
    margin-top: 0.35vw;
    font-size: 0.9vw; font-weight: bold;
    color: #fff; letter-spacing: 0.3px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  }
</style>
</head>
<body>

<div class="cards-row" id="board"></div>

<script>
  const SHEET_ID = "1tHtmiBkYe_BzPV7IVjqrA9uGy5UGQhFZeCRoGRH9-Z4";
  const SLIDE_SECONDS = 7;

  let candidates = [];
  let currentIndex = 0;

  function formatPhotoUrl(raw) {
    if (!raw) return "";
    const trimmed = raw.trim();
    const driveMatch = trimmed.match(/(?:\/d\/|id=)([a-zA-Z0-9_-]{20,})/);
    if (driveMatch && trimmed.includes("drive.google.com")) {
      return `https://drive.google.com/thumbnail?id=${driveMatch[1]}&sz=w1000`;
    }
    if (trimmed.startsWith("http")) return trimmed;
    return `photos/${trimmed}`;
  }

  function parseResultBadges(resultText) {
    const upper = (resultText || "").toUpperCase();
    let position = "";
    let grade = "";

    if (/\b(1ST|FIRST)\b/.test(upper)) position = "1";
    else if (/\b(2ND|SECOND)\b/.test(upper)) position = "2";
    else if (/\b(3RD|THIRD)\b/.test(upper)) position = "3";

    const gradeMatch = upper.match(/\b([A-C])\s*GRADE\b/) || upper.match(/\bGRADE\s*([A-C])\b/) || upper.match(/\bONLY\s*([A-C])\b/);
    if (gradeMatch) grade = gradeMatch[1];

    return { position, grade };
  }

  window.handleSheetData = function(response) {
    if (!response || !response.table || !response.table.rows) return;

    const parsed = response.table.rows.map(row => {
      const cells = row.c || [];
      return {
        category: cells[0]?.v ? String(cells[0].v).trim() : "",
        name:     cells[1]?.v ? String(cells[1].v).trim() : "",
        result:   cells[2]?.v ? String(cells[2].v).trim() : "",
        photo:    cells[3]?.v ? String(cells[3].v).trim() : ""
      };
    }).filter(c => c.name && c.name.toLowerCase() !== "name");

    if (parsed.length) {
      candidates = parsed;
      if (document.getElementById("board").innerHTML === "") {
        renderSlide();
      }
    }
  };

  function fetchResults() {
    const oldScript = document.getElementById("gviz-script");
    if (oldScript) oldScript.remove();

    const script = document.createElement("script");
    script.id = "gviz-script";
    script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:handleSheetData&t=${Date.now()}`;
    document.body.appendChild(script);
  }

  function renderSlide() {
    if (!candidates.length) return;
    const board = document.getElementById("board");
    board.style.opacity = 0;

    setTimeout(() => {
      const slice = candidates.slice(currentIndex, currentIndex + 3);
      board.innerHTML = slice.map((c, idx) => {
        const imgSrc = formatPhotoUrl(c.photo);
        const hasPhoto = Boolean(imgSrc);
        const { position, grade } = parseResultBadges(c.result);
        const themeClass = `theme-${idx % 3}`;

        return `
          <div class="card ${themeClass} ${hasPhoto ? '' : 'no-photo'}">
            <div class="top-badge">
              <svg viewBox="0 0 24 24">
                <path d="M3 7l9-4 9 4M4 7v11h16V7M4 11h16M12 11v7M8 14h2M14 14h2"/>
              </svg>
            </div>

            <div class="category-title">${c.category}</div>

            <div class="sparkle right"></div>
            <div class="sparkle left"></div>

            ${hasPhoto ? `
              <div class="pentagon-wrap">
                <img src="${imgSrc}" alt="${c.name}" onerror="this.parentElement.remove(); this.closest('.card').classList.add('no-photo');">
              </div>
            ` : ''}

            <div class="candidate-name">${c.name}</div>

            <div class="dune-footer">
              <div class="badges-group">
                ${position ? `
                  <div class="stat-item">
                    <div class="stat-circle">${position}</div>
                    <div class="stat-label">Position</div>
                  </div>
                ` : ''}
                ${grade ? `
                  <div class="stat-item">
                    <div class="stat-circle">${grade}</div>
                    <div class="stat-label">Grade</div>
                  </div>
                ` : ''}
              </div>
            </div>
          </div>
        `;
      }).join("");

      board.style.opacity = 1;
      currentIndex = (currentIndex + 3 >= candidates.length) ? 0 : currentIndex + 3;
    }, 500);
  }

  fetchResults();
  setInterval(fetchResults, 30000);
  setInterval(renderSlide, SLIDE_SECONDS * 1000);
</script>
</body>
</html>
